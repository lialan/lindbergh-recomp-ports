// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Native Vulkan builds use their own staged libraries/assets. A development
// build also gets its own package ID (.vulkan), beside the OpenGL app; a
// release (quest/build_vulkan.py --release) keeps the app's ID and installs
// over the OpenGL one.
subprojects {
    afterEvaluate { module ->
        if (module.plugins.hasPlugin('com.android.application') &&
            module.findProperty('nativeRenderer') == 'vulkan') {
            if (module.findProperty('nativeRelease') != 'true')
                module.android.defaultConfig.applicationId += '.vulkan'
            module.android.sourceSets.main.jniLibs.setSrcDirs([module.property('nativeLibsDir')])
            module.android.sourceSets.main.assets.setSrcDirs([module.property('nativeAssetsDir')])
            module.android.sourceSets.main.java.srcDir(module.property('sdlJavaDir'))
        }
    }
}
