apply plugin: 'com.android.application'

// Virtua Tennis 3 VR for Meta Quest. quest/build.sh fills src/main/libs
// and the SDL Java sources before this runs.
android {
    namespace "org.lindbergh.vt3"
    compileSdkVersion 35

    defaultConfig {
        applicationId "org.lindbergh.vt3.vr"
        minSdkVersion 29
        targetSdkVersion 32
        // quest/build.sh passes these: the release tag, and the SHA-256 of
        // the vt3_Lindbergh_HD the game's code was translated from
        versionCode((project.findProperty("appVersionCode") ?: "1") as int)
        versionName(project.findProperty("appVersionName") ?: "0.1.0")
        resValue("string", "elf_sha256", project.findProperty("elfSha256") ?: "")
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lintOptions { abortOnError false }

    sourceSets.main {
        jni.srcDirs = []
        jniLibs.srcDir 'src/main/libs'
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    signingConfigs {
        // Releases (CI) sign with the project key from VT3_KEYSTORE; local
        // builds with this machine's debug key. Android updates an app in
        // place only from the same key.
        release {
            def ks = System.getenv("VT3_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("VT3_KEYSTORE_PASSWORD")
                keyAlias "vt3"
                keyPassword System.getenv("VT3_KEYSTORE_PASSWORD")
            } else {
                storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
