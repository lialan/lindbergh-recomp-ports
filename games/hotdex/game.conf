# The House of the Dead EX: run from elf/, beside the game's fs/ tree.
TITLE="The House of the Dead EX"
FOLDER_HINT="/path/to/hotdex"
ELF=elf/hodexRI.elf
find_game() {
    for d in "$1" "$1/hotdex" "$1/HOTDEX"; do
        [ -f "$d/$ELF" ] && [ -d "$d/fs" ] && { (cd "$d" && pwd); return; }
    done
    return 0                          # no match: callers diagnose the empty path
}
SOLIBS="elf/librnalindbergh_jr.so elf/libcri_soundoutput_lindbergh_jr.so"
