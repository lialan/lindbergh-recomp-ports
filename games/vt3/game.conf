# Virtua Tennis 3 (Sega, 2006): what scripts/ and quest/ need to know
# about this game. Sourced by sh and bash; keep it plain assignments and
# functions.

TITLE="Virtua Tennis 3"
FOLDER_HINT="/path/to/vt3/disk0"

# The game's folder is disk0/: holds vt3_Lindbergh/ (the executable, which
# runs from there, and resource/), shader/ and lib/.
# The working copy is Rev. C's complete data with the HD executable added
# (<workspace>/vt3/disk0); older dumps of vt3.bin were truncated and miss
# James Blake's and Mario Ancic's models (a match against Blake crashes).
ELF=vt3_Lindbergh/vt3_Lindbergh_HD
find_game() {
    for d in "$1" "$1/disk0" "$1/extracted/disk0"; do
        [ -f "$d/vt3_Lindbergh/vt3_Lindbergh_HD" ] && { (cd "$d" && pwd); return; }
    done
}
SOLIBS="lib/libCg.so"

# The Quest app
APP="Virtua Tennis 3 VR"
APK=VirtuaTennis3VR
PKG=org.lindbergh.vt3.vr
ACTIVITY=org.lindbergh.vt3.VirtuaTennis3VR
SHA_FILE=vt3_Lindbergh_HD.elf.sha256
HEADSET_DIR=/sdcard/VirtuaTennis3
HEADSET_SUB=
GAME_PARTS="vt3_Lindbergh shader lib"
ASSET_DIR=game
LOG=vt3.log
SIZE="about 1.8 GB"

# Check for a damaged game tree. The build and install scripts call it when
# a game defines it and stop when it fails (LINDBERGH_ALLOW_DAMAGED_GAME=1
# goes on anyway). Some dumps
# of vt3.bin are cut short: player models come out empty or wrong, the game
# loads them without complaint, and the first match against that player
# crashes the scene loader (James Blake is round 2 of Road to the
# Championship; Mario Ancic depends on the draw). Known-good sha256 of the
# models such dumps have damaged, from a complete Rev. C tree:
VT3_MODELS="
e6137acabfe03d7894032b66c40c11324d7a7fcff27d906bec483c5b4e352672 P_M_BLA_game_all01_base_II.efo
42be2284592a1ba6002ca581a125c4141460542d845205a7e66acbff37efe308 P_M_BLA_game_all_M1_II.efo
b4d081a5bc512dd7ad33d8dbff1cebe02c64922c1e94b86c32dc052e23e3248a P_M_BLA_game_all_M2_II.efo
c7e732be0dec53aba2895961a814a6255ef93b7e2b3296c67cad255e0f4aa274 P_M_BLA_game_all_M3_II.efo
f8859ff80d7c75d6782cdd5483cac41464e453f746dc538bb36e911a66fe966d P_M_BLA_game_all_M4SP_II.efo
eb39ffbe84c1537daa63e561b040c57e9a2ec63c0f1623c34ec358debebf3ed9 P_M_BLA_game_all_M4_II.efo
3873d84e46f31af78d36ecac89229790a832a348f991f6d58806447b1b8a4c94 P_M_ANC_game_all01_base_AN.efo
4d58f18959942881a570ca9e7ad6b76c9f80185c7c6ce0f64815566818d72a0f P_M_ANC_game_all01_M1_AN.efo
544500ac4448b78dc408f64949244ba9c590f0a75a95fb9e9805c0ca6e3f091a P_M_ANC_game_all01_M1SP_AN.efo
36758ff496424541f99e4772675dae8364a2c44856b20dfaef83e2191c28e622 P_M_ANC_game_all01_M2_AN.efo
5e866faada7edf256fbfe7df14825ca9d02265a20bd1383d459783559856fea8 P_M_ANC_game_all01_M3_AN.efo
a80025451dc14a719a793c797ae1e12b1b7cb82bcfb6ff8e5181faffab6894e1 P_M_ANC_game_all01_M4_AN.efo
"
check_game() {
    _list="${TMPDIR:-/tmp}/vt3_check.$$"
    _dir="$1/vt3_Lindbergh/resource/model/player"
    _sha() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
    {
        (cd "$1" && find . -type f -size 0 ! -name 'lindbergh_nvram.bin') | sed 's|^\./|    |; s|$| (empty)|'
        echo "$VT3_MODELS" | while read -r _sum _name; do
            [ -n "$_name" ] || continue
            if [ ! -f "$_dir/$_name" ]; then echo "    vt3_Lindbergh/resource/model/player/$_name (missing)"
            elif [ -s "$_dir/$_name" ] && [ "$(_sha "$_dir/$_name")" != "$_sum" ]; then echo "    vt3_Lindbergh/resource/model/player/$_name (damaged)"; fi
        done
    } > "$_list"
    if [ ! -s "$_list" ]; then rm -f "$_list"; return 0; fi
    {
        echo
        echo "ERROR: this copy of $TITLE is incomplete - these game files are empty,"
        echo "missing or damaged:"
        cat "$_list"
        cat <<MSG

  The game starts and plays, but CRASHES during a tournament as soon as a
  match needs one of these players' models (James Blake is the opponent in
  round 2 of Road to the Championship; Mario Ancic depends on who you
  pick and the draw). Your dump of vt3.bin is probably truncated.
  Take these files from a complete copy - the Rev. C dump,
  "Virtua Tennis 3 (SBKX) (Rev. C)", has them all - and copy them into
  $1/vt3_Lindbergh/resource/model/player/

MSG
    } >&2
    rm -f "$_list"
    return 1
}
