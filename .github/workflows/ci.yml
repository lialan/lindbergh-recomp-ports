name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    # CI has no game, so this configures without lifted code. The CMake then
    # builds the toolkit's self-check through the POSIX/SDL2 host against this
    # repo's pinned submodule, which proves the pin builds. (The Windows build
    # is upstream's and not maintained here: docs/ghostsquadevolution/WINDOWS.md.)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: brew install ninja sdl2
      - run: cmake -S . -B build-mac -G Ninja
      - run: cmake --build build-mac
      - run: build-mac/lindberghrecomp/lindbergh_rt_selftest
