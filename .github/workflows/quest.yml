name: quest
# Builds each game's Meta Quest APK (native Vulkan, quest/build_vulkan.py).
# The games' code, lifted to C from their executables, lives in the private
# repo lialan/gse-recomp-generated, one folder per game, with each game's
# Vulkan inputs in vulkan/<game>/ (its shaders compiled to SPIR-V and its
# pipeline seeds); read with the deploy key in GSE_GENERATED_KEY. An APK
# carries that but none of the game's files, which players copy to the
# headset themselves.
#
# Every push to main leaves the APKs as workflow artifacts; a v* tag also
# publishes them as one GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - game: ghostsquadevolution
            key: GSE            # its signing key: secrets <key>_KEYSTORE_B64 / _PASSWORD
          - game: hotd4
            key: HOTD4
          - game: hotd4sp
            key: HOTD4SP
    env:
      NDK_VERSION: 27.3.13750724
      DEPS: ${{ github.workspace }}/../deps
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Lifted game code (private)
        uses: actions/checkout@v4
        with:
          repository: lialan/gse-recomp-generated
          ssh-key: ${{ secrets.GSE_GENERATED_KEY }}
          path: lifted
      - run: |
          mkdir -p games/${{ matrix.game }}/generated && cp lifted/${{ matrix.game }}/* games/${{ matrix.game }}/generated/
          mv lifted/vulkan "$RUNNER_TEMP/vulkan" && rm -rf lifted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android NDK and SDK platform
        run: |
          sudo apt-get install -y -q ninja-build glslang-tools spirv-cross
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../deps
          key: quest-deps-${{ hashFiles('quest/deps.sh', 'quest/gl4es.patch') }}

      - run: quest/deps.sh

      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then V=$GITHUB_REF_NAME
          else V=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.1.0)-dev.$(git rev-parse --short HEAD); fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_B64: ${{ secrets[format('{0}_KEYSTORE_B64', matrix.key)] }}
          KEYSTORE_PASSWORD: ${{ secrets[format('{0}_KEYSTORE_PASSWORD', matrix.key)] }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export ${{ matrix.key }}_KEYSTORE=$RUNNER_TEMP/release.keystore
          export ${{ matrix.key }}_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          . games/${{ matrix.game }}/game.conf
          VK=$RUNNER_TEMP/vulkan
          python3 quest/build_vulkan.py ${{ matrix.game }} --release "$VERSION" --gradle-online \
            --shader-pack "$VK/${{ matrix.game }}/game.lvsp" --seeds "$VK" \
            --gl-headers-root "$DEPS/gl-headers" --output "quest/$APK.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Check and name the APK
        run: |
          . games/${{ matrix.game }}/game.conf
          # a release must never carry the game's own files: its only assets
          # are the Vulkan runtime's compiled shader packs and pipeline seeds
          if unzip -Z1 "quest/$APK.apk" | grep '^assets/' |
             grep -vxE 'assets/vulkan/(fixed|game)\.lvsp|assets/vulkan/pipelines\.(lvpr|bin)'; then
            echo "the APK contains files other than the Vulkan runtime's"; exit 1
          fi
          OUT=$APK-$VERSION-quest3.apk
          mv "quest/$APK.apk" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          cat "$OUT.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: |
            ${{ env.OUT }}
            ${{ env.OUT }}.sha256

  release:
    if: github.ref_type == 'tag'
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" apks/* \
            --title "Lindbergh VR ports $GITHUB_REF_NAME" --notes-file docs/QUEST-RELEASE.md
